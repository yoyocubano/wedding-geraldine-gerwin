<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D19F"/>
      <stop offset="30%" stop-color="#C5A059"/>
      <stop offset="70%" stop-color="#9E7A36"/>
      <stop offset="100%" stop-color="#E2CA94"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#221C16"/>
      <stop offset="100%" stop-color="#0E0C0A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Outer Dark Luxury Circle -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Inner Delicate Ring -->
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.75" stroke-dasharray="2 1.5" opacity="0.85"/>

  <!-- Interconnected Wedding Rings Symbol at Top -->
  <g stroke="url(#goldGrad)" stroke-width="1.2" fill="none" opacity="0.95">
    <ellipse cx="28.5" cy="19" rx="4.5" ry="3.2" transform="rotate(-15 28.5 19)"/>
    <ellipse cx="35.5" cy="19" rx="4.5" ry="3.2" transform="rotate(15 35.5 19)"/>
  </g>

  <!-- Monogram Y & G -->
  <text x="32" y="44" 
        font-family="'Playfair Display', 'Cormorant Garamond', 'Cinzel', Georgia, serif" 
        font-size="16" 
        font-weight="bold" 
        letter-spacing="1"
        fill="url(#goldGrad)" 
        text-anchor="middle" 
        filter="url(#glow)">Y&amp;G</text>

  <!-- Tiny Gold Star at Bottom -->
  <polygon points="32,49 33,51 35.5,51.2 33.6,52.8 34.2,55 32,53.8 29.8,55 30.4,52.8 28.5,51.2 31,51" fill="url(#goldGrad)" opacity="0.9"/>
</svg>
